services:

  # ==========================================
  # 1. OPTIMIZED SINGLE DATABASE (10 SCHEMAS)
  # ==========================================
  mysqldb:
    image: mysql:8.0
    container_name: airline-mysqldb
    mem_limit: 600m
    mem_reservation: 300m
    cpus: 1.0
    ports:
      - "3306:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=16M
      --max-connections=150
      --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: duong
      MYSQL_PASSWORD: duong123
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================
  # 2. INFRASTRUCTURE & CLOUD SERVICES
  # ==========================================
  config-server:
    image: "080900005/yt-gds-config-server:1.0.0"
    container_name: yt-gds-config-server
    mem_limit: 350m
    mem_reservation: 200m
    cpus: 0.5
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: "https://github.com/DuongNguyen8905/airline-booking-config.git"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx140m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  service-registry:
    image: "080900005/yt-gds-service-registry:1.0.0"
    container_name: yt-gds-eureka-server
    mem_limit: 350m
    mem_reservation: 200m
    cpus: 0.5
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx140m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api_gateway:
    image: "080900005/yt-gds-api-gateway:1.0.0"
    container_name: yt-gds-gateway
    mem_limit: 350m
    mem_reservation: 200m
    cpus: 0.5
    ports:
      - "5000:5000"
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "api-gateway"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k -Deureka.client.service-url.defaultZone=http://service-registry:8761/eureka"

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"

  # ==========================================
  # 3. DOMAIN BUSINESS MICROSERVICES
  # ==========================================
  user-service:
    image: "080900005/yt-gds-user:1.0.0"
    container_name: yt-gds-user-service
    mem_limit: 320m
    mem_reservation: 180m
    cpus: 0.4
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      mysqldb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "user-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/yt_airline_user_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx140m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k"

  airline-core-service:
    image: "080900005/yt-gds-airline:1.0.0"
